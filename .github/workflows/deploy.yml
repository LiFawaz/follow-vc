name: Build and Deploy Revenge Plugin Repository

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  validate-and-build:
    runs-on: ubuntu-latest
    env:
      npm_config_legacy_peer_deps: "true"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: pnpm install --no-frozen-lockfile --ignore-scripts

      - name: Run tests
        run: pnpm test

      - name: Build Revenge Next plugin
        run: pnpm run build

      - name: Package plugin and generate repository index
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          ID="$(node -p "require('./plugins/vc-follow/manifest.json').id")"
          VERSION="$(node -p "require('./plugins/vc-follow/manifest.json').version")"
          mkdir -p "dist/pool" package
          test -s "plugins/vc-follow/build/js/index.js"
          cp "plugins/vc-follow/manifest.json" package/manifest.json
          cp "plugins/vc-follow/build/js/index.js" package/index.js
          (cd package && zip -q "../dist/pool/${ID}@${VERSION}.zip" manifest.json index.js)
          pnpm exec revenge-plugin generate-index \
            --dist dist/pool \
            --base-url "https://kkssmm918839-crypto.github.io/follow-vc/pool" \
            --out dist/index.json
          test -s dist/index.json
          node -e "const i=require('./dist/index.json'); if(i.format!==1 || !i.plugins['dev.community.vc-follow']) process.exit(1)"

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: validate-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
