name: Validate VC Follow

on:
  push:
    branches: [main, "fix/**"]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    env:
      npm_config_legacy_peer_deps: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.18"
      - run: npm install --legacy-peer-deps --ignore-scripts
      - run: npm test
      - run: npm run build
